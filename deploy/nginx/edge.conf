# Egreen Quanta — TLS-terminating edge reverse proxy (docker-compose.prod.yml).
#
# Terminates HTTPS, forwards to the SPA container (frontend:80) and the API
# container (backend:8000). Mount a real certificate + key at:
#   /etc/nginx/certs/fullchain.pem
#   /etc/nginx/certs/privkey.pem
# For a staging box run deploy/nginx/gen-selfsigned.sh first.

# --- redirect all plain HTTP to HTTPS ---
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Allow ACME http-01 challenges through if you bolt on certbot later.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 308 https://$host$request_uri;
    }
}

# --- HTTPS edge ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS is set here (edge is the only TLS speaker). 2 years + preload-ready.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    client_max_body_size 30m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    # Server-Sent Events: no buffering, keep the connection open.
    location /api/v1/stream/ {
        proxy_pass http://backend:8000;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        chunked_transfer_encoding off;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_read_timeout 75s;
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_read_timeout 30s;
    }
}
