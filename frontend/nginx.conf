server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API to the backend service on the compose network.
    # Resolved at request time (not config-load time) via the resolver directive,
    # so nginx still boots and serves the SPA even when "backend" doesn't exist on
    # this network (e.g. frontend and backend deployed as separate standalone
    # services, each reached directly via an absolute VITE_API_BASE_URL) —
    # without the resolver+variable indirection, an unresolvable upstream host
    # makes nginx refuse to start at all, taking the whole site down with it.
    resolver 127.0.0.11 valid=10s;
    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;

        # Server-Sent Events (alert stream)
        proxy_set_header Connection "";
        proxy_buffering off;
        chunked_transfer_encoding off;
    }

    # Static asset caching
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    client_max_body_size 30m;
}
