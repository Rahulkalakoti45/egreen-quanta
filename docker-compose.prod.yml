# Egreen Quanta — production-hardened stack.
#
#   cp .env.example .env         # then set every secret (SECRET_KEY, POSTGRES_PASSWORD,
#                                # REDIS_PASSWORD, ALLOWED_HOSTS, CORS_ORIGINS, ...)
#   sh deploy/nginx/gen-selfsigned.sh yourhost   # or drop real certs in deploy/nginx/certs/
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Differences from docker-compose.yml (the local demo stack):
#   * TLS-terminating nginx edge is the only container with published ports (80/443)
#   * Redis is present; a dedicated `worker` runs the scheduler so the web workers
#     can run with SCHEDULER_ENABLED=false (no duplicated periodic jobs)
#   * every service has restart: unless-stopped and a healthcheck
#   * required secrets use ${VAR:?...} so `up` fails fast when unset
name: egreen-quanta-prod

x-backend-image: &backend-image
  build:
    context: ./backend
  image: egreen-quanta-backend:prod

x-backend-env: &backend-env
  APP_ENV: prod
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-egreen}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-egreen}
  REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/0
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY (>=32 chars)}
  JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:?set ALLOWED_HOSTS, e.g. egreen.example.com}
  CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS, e.g. https://egreen.example.com}
  LOG_JSON: "true"
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  ML_ENABLED: ${ML_ENABLED:-false}
  AUDIT_SIGNING_KEY: ${AUDIT_SIGNING_KEY:-}
  OUTBOUND_REVOCATION: ${OUTBOUND_REVOCATION:-false}
  NOTIFY_HIGH_SEVERITY: ${NOTIFY_HIGH_SEVERITY:-false}
  SLACK_WEBHOOK: ${SLACK_WEBHOOK:-}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-egreen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-egreen}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-egreen} -d ${POSTGRES_DB:-egreen}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}", "--save", "60", "1", "--appendonly", "no"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}

  backend:
    <<: *backend-image
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *backend-env
      SCHEDULER_ENABLED: "false"          # the `worker` service owns the scheduler
      SEED_ON_START: ${SEED_ON_START:-true}
    volumes:
      - modeldata:/app/var/models
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    # default CMD: gunicorn + uvicorn workers on :8000 (see backend/Dockerfile)

  worker:
    <<: *backend-image
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy       # backend has already run `alembic upgrade head`
    environment:
      <<: *backend-env
      SCHEDULER_ENABLED: "true"
      AUDIT_ANCHOR_ENABLED: ${AUDIT_ANCHOR_ENABLED:-true}
      AUDIT_ANCHOR_INTERVAL_HOURS: ${AUDIT_ANCHOR_INTERVAL_HOURS:-24}
      RETENTION_DAYS: ${RETENTION_DAYS:-0}
      SEED_ON_START: "false"
    volumes:
      - modeldata:/app/var/models
    command: ["python", "-m", "app.workers.scheduler"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import sys; sys.exit(0)\""]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api/v1
    image: egreen-quanta-frontend:prod
    restart: unless-stopped
    depends_on:
      - backend

  edge:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/edge.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
      - certbot-www:/var/www/certbot
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider --no-check-certificate https://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
  redisdata:
  modeldata:
  certbot-www:
